      title: 关注喜欢的作者与作品，不错过新的更新
      first_message_excerpt: |-
        ## 关注与动态功能上线啦

        现在可以在作者 Hover 卡片和作者页关注作者，也可以在作品菜单中关注单部作品。关注之后，相关更新会集中出现在新的动态页中。

        ### 动态页会展示什么

        - 关注作品发布的新版本与更新说明。
        - 关注作者发布的新作品。
        - Odysseia 的重要公告与系统通知。

        顶部的动态来源可以切换“全部动态”“系统通知”或某位作者；“未读”筛选与“全部已读”也会同时覆盖系统通知和作品动态。关注管理页仍只负责管理关注关系，不会替代动态页。
