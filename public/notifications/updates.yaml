      first_message_excerpt: |-
        ## 通知不该悄悄躲起来

        通知中心已经完成升级啦！普通动态仍然会安静地收进通知列表，等待你有空时查看；真正重要的服务器公告，则会主动出现在页面中，避免关键消息被错过。

        ### 这次有什么变化？

        - 团队公告拥有了独立的阅读界面，不会再被误认为普通帖子。
        - 重要公告会主动弹出，需要阅读并确认后才能关闭。
        - 已经确认过的公告会被记住，之后不会反复打扰。
        - 所有历史旧通知均已清理，通知列表从这里重新开始。

        希望新的通知中心既不会错过真正重要的事情，也不会在平时打扰你。感谢一直陪着我们完善 Odysseia！
