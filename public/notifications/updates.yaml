      title: 问问类脑娘，让搜索更接近你的想法
      first_message_excerpt: |-
        ## 类脑娘搜索上线啦

        你可以直接描述想找的作品，也可以用 `@` 快速指定 Tag、作者或频道。类脑娘会调用论坛现有的搜索接口，筛选候选结果，并在需要时进一步阅读帖子内容。

        ### 使用前请注意

        - Odysseia 提供的是运行在浏览器中的搜索 Agent，不提供免费模型服务。
        - 使用前需要在模型设置中填写你自己的兼容 OpenAI API 地址，并获取和选择模型。
        - API Key 只保存在当前浏览器，但搜索请求和相关摘要会发送给你配置的模型服务，请确认自己信任对应的服务商。
        - 搜索结果来自论坛索引，帖子实际内容与可访问状态仍以 Discord 为准。

        配置完成后，就可以告诉类脑娘一个模糊的想法，让她帮你一步步缩小范围啦。
