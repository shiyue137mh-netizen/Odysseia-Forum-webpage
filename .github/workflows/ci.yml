name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint:styles

      - name: 单元测试
        run: pnpm test:run

      - name: 构建
        run: pnpm build
